<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Visor de Ultra Alta Resolucion</title>

<link rel="stylesheet" href="css/styles.css">


</head>

<body>


<div id="viewport">

    <div id="tile-container"></div>

</div>

<div id="controls">

    <p>
        Nivel de Zoom (Z):
        <span id="zoom-level">0</span>
    </p>

    <p>
        Arrastra con el mouse para desplazarte.
        Rueda para zoom.
    </p>

</div>

<!-- Gestion de posicion, zoom y teselas visibles -->
<script src="js/viewport-manager.js"></script>

<!-- Comunicacion con el protocolo propio del servidor -->
<script src="js/protocol-client.js"></script>

<!-- Gestion de memoria y eliminacion de teselas -->
<script src="js/tile-purger.js"></script>

<!-- Logica principal de la aplicacion -->
<script src="js/app.js"></script>


</body>
</html>
